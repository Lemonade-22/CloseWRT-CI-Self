# WRT-CORE-SELF —— 本仓自用的完整构建核心，面向自维护机型
# （当前：hanwckf/immortalwrt-mt798x 的 openwrt-21.02 / Linux 5.4，Cudy TR3000）。
#
# 设计原则：
#   1. 这里不写任何机型名。机型判别交给 Scripts/Device.sh，
#      由它把 WRT_CONFIG 映射到 custom/<机型>/ 目录。
#   2. 机型的东西（Config、patches、scripts、verify）全在 custom/<机型>/ 下，
#      新增机型只改 Device.sh 的一个 case 分支 + 建一个目录。
#   3. 上游 WRT-CORE.yml 一个字不动，随时能同步。
name: WRT-CORE-SELF

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        description: '机型配置名，同时决定 custom/<机型>/ 的归属（见 Scripts/Device.sh）'
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    # 21.02 的工具链和脚本在 24.04 上会踩 python3.12 / gcc-14，
    # 钉在 22.04 是最省事的做法，别改成 ubuntu-latest。
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo systemctl stop unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install \
            bc bison build-essential ca-certificates ccache cpio curl \
            device-tree-compiler dos2unix file flex g++ gawk gcc-multilib \
            gettext git gperf haveged help2man intltool libelf-dev \
            libfuse-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libtool-bin make nano patch pkg-config \
            python3 python3-distutils python3-pyelftools python3-setuptools \
            python3-yaml rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev
          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -sfn /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      # ---- 机型判别：全流程唯一认机型的地方 ----
      - name: Resolve Device
        run: |
          set -euo pipefail
          eval "$(bash "$GITHUB_WORKSPACE/Scripts/Device.sh" resolve "$WRT_CONFIG")"
          {
            echo "DEVICE=$DEVICE"
            echo "DEVICE_DIR=$DEVICE_DIR"
          } >> "$GITHUB_ENV"
          if [ -n "$DEVICE_DIR" ]; then
            echo "自维护机型：$DEVICE（目录 $DEVICE_DIR）"
          else
            echo "通用机型：走 Config/ 与 Scripts/"
          fi

      - name: Initialization Values
        id: initialize-values
        run: |
          set -euo pipefail
          # 设备型号从 .config 里读，不靠文件名猜
          if [ -n "${DEVICE_DIR:-}" ]; then
            CFG="$GITHUB_WORKSPACE/$DEVICE_DIR/Config/$WRT_CONFIG.txt"
          else
            CFG="$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt"
          fi
          [ -f "$CFG" ] || { echo "::error::找不到配置 $CFG"; exit 1; }
          WRT_DEVICE=$(grep -m 1 -oP '^CONFIG_TARGET_DEVICE_[a-z0-9_]+_DEVICE_\K[^=]+(?==y)' "$CFG" || true)
          [ -n "$WRT_DEVICE" ] || { echo "::error::$CFG 里没有 CONFIG_TARGET_DEVICE_*=y"; exit 1; }
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_PREFIX="wrt-self-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_DEVICE"

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_DEVICE=$WRT_DEVICE"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/
          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;
          bash "$GITHUB_WORKSPACE/Scripts/Device.sh" verify "$WRT_CONFIG"

      - name: Apply device patch
        run: |
          set -euo pipefail
          cd ./wrt/
          if [ -z "${DEVICE_DIR:-}" ]; then
            echo "通用机型：无设备补丁"
            exit 0
          fi
          shopt -s nullglob
          PATCHES=("$GITHUB_WORKSPACE/$DEVICE_DIR"/patches/*.patch)
          if [ ${#PATCHES[@]} -eq 0 ]; then
            echo "该机型无补丁"
            exit 0
          fi
          for PATCH in "${PATCHES[@]}"; do
            echo "==> $(basename "$PATCH")"
            # 先 dry-run：上游一改这里立刻红，而不是编到一半才报废
            git apply --check "$PATCH"
            git apply "$PATCH"
          done
          git diff --stat

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          set -euo pipefail
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          set -euo pipefail
          cd ./wrt/
          if [ -n "${DEVICE_DIR:-}" ] && [ -f "$GITHUB_WORKSPACE/$DEVICE_DIR/scripts/Packages.sh" ]; then
            bash "$GITHUB_WORKSPACE/$DEVICE_DIR/scripts/Packages.sh"
          elif [ -f "$GITHUB_WORKSPACE/Scripts/Packages.sh" ]; then
            bash "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          fi

      - name: Custom Settings
        run: |
          set -euo pipefail
          cd ./wrt/
          if [ -n "${DEVICE_DIR:-}" ]; then
            CFG="$GITHUB_WORKSPACE/$DEVICE_DIR/Config/$WRT_CONFIG.txt"
          else
            CFG="$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt"
          fi
          [ -f "$CFG" ] || { echo "::error::找不到配置 $CFG"; exit 1; }
          cp "$CFG" .config
          if [ -f "$GITHUB_WORKSPACE/Config/GENERAL.txt" ]; then
            cat "$GITHUB_WORKSPACE/Config/GENERAL.txt" >> .config
          fi
          if [ -n "${DEVICE_DIR:-}" ] && [ -f "$GITHUB_WORKSPACE/$DEVICE_DIR/scripts/Settings.sh" ]; then
            bash "$GITHUB_WORKSPACE/$DEVICE_DIR/scripts/Settings.sh"
          elif [ -f "$GITHUB_WORKSPACE/Scripts/Settings.sh" ]; then
            bash "$GITHUB_WORKSPACE/Scripts/Settings.sh"
          fi
          make defconfig

          # 设备符号必须真的在最终 .config 里，被 kconfig 丢掉要当场发现
          grep -qx "CONFIG_TARGET_DEVICE_[a-z0-9_]*_DEVICE_${WRT_DEVICE}=y" .config 2>/dev/null ||
            grep -q "CONFIG_TARGET_DEVICE_.*${WRT_DEVICE}=y" .config ||
            { echo "::error::设备符号丢失：${WRT_DEVICE}"; exit 1; }

          # 机型自带的校验（关键包是否还在）
          if [ -n "${DEVICE_DIR:-}" ] && [ -f "$GITHUB_WORKSPACE/$DEVICE_DIR/scripts/verify.sh" ]; then
            bash "$GITHUB_WORKSPACE/$DEVICE_DIR/scripts/verify.sh"
          fi

      - name: Prepare Rust Toolchain
        if: ${{ !inputs.WRT_TEST && hashFiles('.github/scripts/prepare-rust.sh') != '' }}
        continue-on-error: true
        run: |
          cd ./wrt/
          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh || echo "跳过：21.02 线通常无需 Rust 工具链"

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        timeout-minutes: 60
        run: |
          cd ./wrt/
          make download -j$(nproc) || make download -j1 V=s

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

      - name: Collect Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        run: |
          cd ./wrt/
          if [ -x "$GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh" ]; then
            $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh
          else
            echo "无 collect-build-reports.sh，跳过"
          fi

      - name: Upload Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@main
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/
          echo "======================="
          lscpu | grep -E "name|Core|Thread" || true
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 | head -20

      - name: Package Firmware
        run: |
          set -euo pipefail
          cd ./wrt/ && mkdir -p ./upload/
          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | head -1)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | sort -u | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} + || true
            for FILE in $(find ./bin/targets/ -type f); do
              BASE=$(basename "$FILE")
              mv -f "$FILE" "./upload/${BASE%.*}-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".${BASE##*.}"
            done
          fi

      - name: Release Firmware
        if: ${{ !inputs.WRT_TEST }}
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            自维护机型固件：${{env.WRT_CONFIG}}

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            设备：${{env.WRT_DEVICE}}
            机型目录：${{env.DEVICE_DIR}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}
            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

            设备适配与已知限制见仓库 custom/${{env.DEVICE}}/README.md，刷机前务必确认分区与硬件一致。

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-self-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail
          # 保留当前 key 与最近一代，其余删除，防止 cache 无限增长挤爆配额
          KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key' 2>/dev/null || true)
          PREFIXED=$(gh cache list --repo "$GH_REPO" --limit 100 --json key --jq '.[].key' 2>/dev/null | grep -F "$WRT_CACHE_PREFIX-" || true)
          echo "当前 key: $WRT_CACHE_KEY"
          echo "前缀匹配: $(echo "$PREFIXED" | wc -l) 条"
          KEEP=$(echo "$PREFIXED" | sort -r | head -2)
          echo "$PREFIXED" | while IFS= read -r K; do
            [ -n "$K" ] || continue
            if echo "$KEEP" | grep -qxF "$K"; then
              echo "保留 $K"
            else
              echo "删除 $K"
              gh cache delete "$K" --repo "$GH_REPO" --ref "$GITHUB_REF" 2>/dev/null || true
            fi
          done

