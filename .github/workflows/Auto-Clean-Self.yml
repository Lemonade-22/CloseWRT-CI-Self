#
# 按标题保留每种构建线最新的若干个 Release，其余连同 tag 一起删。
# 一条"线"是 Release 标题里时间戳之前那部分，例如
# TR3000-hanwckf-immortalwrt-mt798x-openwrt-21.02 在
# TR3000-hanwckf-immortalwrt-mt798x-openwrt-21.02-26.11.19-21.30.11 里。
name: Auto-Clean-Self

on:
  # 每天北京时间 05:21
  schedule:
    - cron: '21 21 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: '每种标题保留的最新 Release 数量（至少 1 个）'
        type: number
        default: 3
        required: true
      dry_run:
        description: '仅列出将删除的 Release，不实际删除'
        type: boolean
        default: true
        required: true
      delete_tags:
        description: '同时删除被清理 Release 的 git tag'
        type: boolean
        default: true
        required: true

permissions:
  contents: write

concurrency:
  group: auto-clean-self
  cancel-in-progress: false

jobs:
  clean-releases:
    name: 按标题保留最新 Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup script
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Delete older releases per title
        uses: actions/github-script@v8
        env:
          CLEAN_KEEP: ${{ inputs.keep }}
          CLEAN_DRY_RUN: ${{ inputs.dry_run }}
          CLEAN_DELETE_TAGS: ${{ inputs.delete_tags }}
        with:
          retries: 3
          script: |
            const clean = require('./Scripts/Clean-Releases.cjs');
            await clean({
              github,
              context,
              core,
              keep: process.env.CLEAN_KEEP,
              dryRun: process.env.CLEAN_DRY_RUN || 'false',
              deleteTags: process.env.CLEAN_DELETE_TAGS || 'true'
            });
